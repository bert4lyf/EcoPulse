<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111315">
    <title>EcoPulse - You're offline</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #111315; color: #f1f5f9; }
      main { width: min(100% - 2rem, 36rem); padding: 2rem; border: 1px solid #854d0e; border-radius: 1rem; background: #1c1b18; }
      h1 { margin-top: 0; color: #fbbf24; font-size: 2rem; }
      p { color: #cbd5e1; font-size: 1.125rem; line-height: 1.7; }
      a { color: #fca5a5; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>The shelter list may still be available from the saved app on this device. Return to EcoPulse when your connection is restored.</p>
      <p><a href="/">Try the saved home screen again</a></p>
    </main>
  </body>
</html>
